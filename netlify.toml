[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/v2"
  to = "/v2/"
  status = 301

[[redirects]]
  from = "/v2/"
  to = "/v2/index.html"
  status = 200

[[redirects]]
  from = "/v3"
  to = "/v3/"
  status = 301

[[redirects]]
  from = "/v3/"
  to = "/v3/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
