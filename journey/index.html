<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Journey Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="journey-screen">
    <header class="site-header">
      <a class="wordmark" href="/">Journey Planner</a>
      <a class="header-lab" href="/" aria-label="Back to search">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M19 12H6M11 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </a>
      <label class="flag-toggle" hidden>
        <span class="flag-toggle-label">Get to the Stadium</span>
        <span class="flag-toggle-control">
          <input id="stadium-toggle" class="flag-toggle-input" type="checkbox" role="switch" />
          <span class="flag-toggle-switch" aria-hidden="true"></span>
        </span>
      </label>
    </header>

    <main class="page journey-view">
      <p id="journey-status" class="status" role="status">Loading journey…</p>
      <article id="journey-detail" class="journey-detail" hidden></article>
    </main>

    <dialog class="step-free-sheet" id="step-free-sheet" aria-labelledby="step-free-sheet-title">
      <div class="step-free-sheet-grab" aria-hidden="true"></div>
      <div class="step-free-sheet-head">
        <div>
          <h2 id="step-free-sheet-title"></h2>
          <p class="step-free-sheet-status" id="step-free-sheet-status"></p>
        </div>
        <button type="button" class="step-free-sheet-close" aria-label="Close">
          <svg viewBox="0 0 32 32" width="16" height="16" aria-hidden="true">
            <path d="M6 6l20 20M26 6 6 26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" />
          </svg>
        </button>
      </div>
      <div class="step-free-sheet-body" id="step-free-sheet-body"></div>
    </dialog>

    <script type="module" src="/src/journey-page.js"></script>
  </body>
</html>
